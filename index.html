<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Descargar videos — TikTok y Facebook</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .caja {
      width: 100%;
      max-width: 520px;
      background: #1e293b;
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 10px 40px rgba(0,0,0,.4);
    }
    h1 { font-size: 24px; margin: 0 0 6px; text-align: center; }
    p.sub { margin: 0 0 24px; text-align: center; color: #94a3b8; font-size: 14px; }
    input {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      border: 2px solid #334155;
      border-radius: 10px;
      background: #0f172a;
      color: #e2e8f0;
      margin-bottom: 14px;
    }
    input:focus { outline: none; border-color: #38bdf8; }
    button {
      width: 100%;
      padding: 14px;
      font-size: 17px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      background: #38bdf8;
      color: #0f172a;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: not-allowed; }
    #estado { margin-top: 18px; text-align: center; font-size: 15px; min-height: 22px; }
    .error { color: #f87171; }
    #resultado { margin-top: 20px; text-align: center; }
    #resultado img { max-width: 100%; border-radius: 10px; margin-bottom: 14px; }
    #resultado .titulo { font-size: 14px; color: #cbd5e1; margin-bottom: 14px; }
    a.descargar {
      display: inline-block;
      padding: 13px 24px;
      background: #22c55e;
      color: #04240f;
      font-weight: 700;
      border-radius: 10px;
      text-decoration: none;
    }
    .nota { margin-top: 12px; font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <div class="caja">
    <h1>⬇️ Descargar video</h1>
    <p class="sub">Pega el link de TikTok o Facebook. Sin anuncios.</p>

    <input id="url" type="text" placeholder="Pega aquí el link del video..." autocomplete="off" />
    <button id="btn">Descargar</button>

    <div id="estado"></div>
    <div id="resultado"></div>
  </div>

  <script>
    const input = document.getElementById("url");
    const btn = document.getElementById("btn");
    const estado = document.getElementById("estado");
    const resultado = document.getElementById("resultado");

    async function procesar() {
      const url = input.value.trim();
      resultado.innerHTML = "";
      estado.className = "";

      if (!url) {
        estado.textContent = "Primero pega un link.";
        return;
      }

      btn.disabled = true;
      estado.textContent = "Procesando… ⏳";

      try {
        const resp = await fetch("/api/download?url=" + encodeURIComponent(url));
        const data = await resp.json();

        if (!resp.ok) {
          throw new Error(data.error || "No se pudo procesar.");
        }

        estado.textContent = "¡Listo! ✅";
        resultado.innerHTML = `
          ${data.miniatura ? `<img src="${data.miniatura}" alt="miniatura" />` : ""}
          <div class="titulo">${data.titulo || ""}</div>
          <a class="descargar" href="${data.url_directa}" download target="_blank" rel="noopener">
            Descargar MP4
          </a>
          <div class="nota">Si el video se abre en vez de bajar, mantén presionado /
          clic derecho sobre él y elige "Guardar video".</div>
        `;
      } catch (e) {
        estado.className = "error";
        estado.textContent = "⚠️ " + e.message;
      } finally {
        btn.disabled = false;
      }
    }

    btn.addEventListener("click", procesar);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") procesar();
    });
  </script>
</body>
</html>
